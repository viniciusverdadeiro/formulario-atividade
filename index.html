<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>The Boys - Vitrine</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="topo">
            <section class="titulo">
                <h1>Heróis</h1>
                <p>Formulário de heróis</p>
            </section>
        </header>
        <main>
            <section id="formulario">
                
                <form action="#" method="get">
                    <label for="busca">Faça sua inscrição</label>

                    <label for="nome">Nome de herói</label>
                    <input id="nome" name="nome" type="text" />

                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" />

                    <label for="idade">Idade</label>
                    <input id="idade" name="idade" type="number" />

                        <label for="periodo">Escolha sua equipe</label>
                    <select id="equipe" name="equipe">
                    <option>Liga da jusiça</option>
                    <option>Marvel</option>
                    <option>Batman</option>
                    </select>
                    
                    <p>Qual equipe prefere?</p>
                    <section id="prefere">
                    <input id="manha" name="periodo" type="radio" />
                    <label for="manha">Voar</label>
                     <input id="manha" name="periodo" type="radio" />
                    <label for="manha">Supervelocidade</label>
                     <input id="manha" name="periodo" type="radio" />
                    <label for="manha">Superforça</label>
                        
                    <input id="tarde" name="periodo" type="radio" />
                    <label for="tarde">Quero receber novas missões</label>

                    <input id="novidades" name="novidades" type="checkbox" />
                    <label for="novidades"></label>
                    
                    </section>

                    <label for="expectativa">Porque você quer ser um herói?</label>
                    <textarea id="expectativa" name="expectativa" rows="4"></textarea>
                    <button type="submit">Enviar inscrição</button>
                </form>
            </section>     
                </article>
            </section>
        </main>
        <footer><p>Prática de formulários HTML</p></footer>
    </body>
</html>
